<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Page not found · toolspace</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root { --bg: #f6f6f3; --text: #0a0a0a; --muted: #5c5c5c; --line: #e0e0da; --del: #ffe1dd; --del-fg: #b3261e; --add: #d7f5df; --add-fg: #11672b; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0a0a0a; --text: #fafafa; --muted: #a3a3a3; --line: #242424; --del: rgba(255,82,70,.17); --del-fg: #ff8a80; --add: rgba(46,204,113,.17); --add-fg: #5be08f; }
      }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { max-width: 460px; padding: 24px; }
      pre { margin: 0 0 24px; padding: 12px 0; border: 1px solid var(--line); border-radius: 12px;
        font: 13px/1.8 ui-monospace, 'SF Mono', Menlo, monospace; overflow: hidden; }
      pre span { display: block; padding: 0 14px; }
      .del { background: var(--del); color: var(--del-fg); }
      .add { background: var(--add); color: var(--add-fg); }
      h1 { margin: 0; font-size: 28px; letter-spacing: -0.03em; }
      p { color: var(--muted); }
      a { display: inline-block; margin-top: 8px; padding: 9px 18px; border-radius: 999px; background: var(--text); color: var(--bg); text-decoration: none; font-weight: 500; }
    </style>
  </head>
  <body>
    <main>
      <pre aria-hidden="true"><span class="del">- this page</span><span class="add">+ 404: not found</span></pre>
      <h1>This page doesn't exist</h1>
      <p>The link may be mistyped or out of date. The diff checker itself is one click away.</p>
      <a href="/">Go to toolspace</a>
    </main>
  </body>
</html>
